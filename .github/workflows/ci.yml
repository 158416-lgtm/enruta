name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verificar formato
        run: mvn -B -q spotless:check

      - name: Compilar y testear
        run: mvn -B -T 1C verify

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          retention-days: 7

  infra-smoke:
    name: Smoke de infraestructura
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Levantar infraestructura
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Verificar topicos
        run: |
          docker compose -f infra/docker-compose.yml exec -T kafka \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list | sort

      - name: Verificar PostgreSQL
        run: |
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U enruta -d enruta -c "SELECT datname FROM pg_database WHERE datname LIKE '%db';"

      - name: Logs en caso de fallo
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200

      - name: Bajar todo
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
