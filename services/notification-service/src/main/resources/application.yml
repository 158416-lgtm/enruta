server:
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifdb}
    username: ${DB_USER:enruta}
    password: ${DB_PASSWORD:enruta}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 50
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
eruta:
  notification:
    max-attempts: 3
    backoff: 2s,10s,30s
    webhook-secret: ${WEBHOOK_SECRET:change-me}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
