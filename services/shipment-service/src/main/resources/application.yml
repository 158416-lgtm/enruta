server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shipmentdb}
    username: ${DB_USER:enruta}
    password: ${DB_PASSWORD:enruta}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      max-poll-records: 50
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
enruta:
  outbox:
    enabled: true
    poll-interval-ms: 500
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
