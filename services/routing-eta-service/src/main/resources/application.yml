server:
  port: ${SERVER_PORT:8085}
spring:
  application:
    name: routing-eta-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
enruta:
  routing:
    osrm-base-url: ${OSRM_BASE_URL:http://localhost:5000}
    osrm-timeout: 2s
    cache-ttl: 20s
    fallback-average-speed-kph: 25
resilience4j:
  circuitbreaker:
    instances:
      osrm:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      osrm:
        timeout-duration: 3s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
