server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/authdb}
    username: ${DB_USER:enruta}
    password: ${DB_PASSWORD:enruta}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
enruta:
  auth:
    issuer: ${JWT_ISSUER:http://localhost:18080}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    jwk-path: ${AUTH_JWK_PATH:keys/auth-jwk.json}
    seed: ${AUTH_SEED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
