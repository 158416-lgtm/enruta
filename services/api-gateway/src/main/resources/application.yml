server:
  port: ${SERVER_PORT:18080}
spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Gateway, enruta
      routes:
        - id: auth
          uri: ${AUTH_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: shipments
          uri: ${SHIPMENT_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/shipments/**
        - id: dispatch
          uri: ${DISPATCH_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/drivers/**,/api/v1/offers/**,/api/v1/assignments/**,/api/v1/dispatch/**
        - id: tracking
          uri: ${TRACKING_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/tracking/**,/ws/**
        - id: eta
          uri: ${ROUTING_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/eta/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
