global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: enruta
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:18080
          - host.docker.internal:18081
          - host.docker.internal:18082
          - host.docker.internal:18083
          - host.docker.internal:8084
          - host.docker.internal:8085
          - host.docker.internal:8086
        labels:
          entorno: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
