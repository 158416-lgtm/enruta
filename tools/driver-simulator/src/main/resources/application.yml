server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: driver-simulator
enruta:
  simulator:
    auth-url: ${AUTH_URL:http://localhost:8081}
    dispatch-url: ${DISPATCH_URL:http://localhost:8083}
    osrm-url: ${OSRM_BASE_URL:http://localhost:5000}
    driver-count: ${SIM_DRIVER_COUNT:6}
    center-lat: ${SIM_CENTER_LAT:4.3449}
    center-lng: ${SIM_CENTER_LNG:-74.3674}
    password: ${SIM_PASSWORD:Driver1234!}
    auto-accept: ${SIM_AUTO_ACCEPT:true}
    tick-interval-ms: ${SIM_TICK_INTERVAL_MS:2000}
    tick-initial-delay-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
